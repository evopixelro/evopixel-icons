[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evopixel-icons"
version = "1.2.1"
description = "Custom icon font for EvoPixel projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fonttools==4.66.1",
  "brotli==1.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
evopixel-icons = "evopixel_icons:main"

[project.urls]
Repository = "https://github.com/evopixelro/evopixel-icons"
Issues = "https://github.com/evopixelro/evopixel-icons/issues"

[tool.setuptools]
py-modules = ["evopixel_icons"]
package-dir = {"" = "scripts"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
